# Netlify deployment for the Talos web app (pnpm monorepo, TanStack Start SPA mode).
#
# The app builds to apps/web/dist/client with a prerendered SPA shell (_shell.html).
# The catch-all redirect serves that shell for every client route so deep links resolve
# instead of 404-ing (static files still take precedence over the redirect).

[build]
  command = "pnpm install --no-frozen-lockfile && pnpm build"
  publish = "apps/web/dist/client"

[build.environment]
  NODE_VERSION = "20"
  # X Layer testnet (public VITE_ vars, embedded at build time).
  VITE_CHAIN_ID = "1952"
  VITE_XLAYER_RPC_URL = "https://testrpc.xlayer.tech/terigon"
  VITE_XLAYER_EXPLORER_URL = "https://www.okx.com/web3/explorer/xlayer-test"
  # Deployed Core Server (override in the Netlify UI if it changes).
  VITE_TALOS_API_BASE_URL = "https://talos-c4wi.onrender.com"

# SPA fallback — serve the prerendered shell for any unmatched (client-routed) path.
[[redirects]]
  from = "/*"
  to = "/_shell.html"
  status = 200
# Do not force this redirect for static asset requests. Netlify should serve files
# from /assets/* normally and only rewrite unmatched browser routes to the shell.

# Talos — local development infrastructure (Phase 1)
#
# Provides only the datastores needed for local development:
#   - PostgreSQL (indexed / off-chain state — NOT the source of cryptographic truth)
#   - Redis      (cache / queue)
#
# Start:   docker compose up -d
# Health:  docker compose ps
# Stop:    docker compose down            (keeps volumes)
# Reset:   docker compose down -v         (destroys volumes)

services:
  postgres:
    image: postgres:16-alpine
    container_name: talos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-talos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-talos}
      POSTGRES_DB: ${POSTGRES_DB:-talos}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - talos-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-talos} -d ${POSTGRES_DB:-talos}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: talos-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - talos-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  talos-postgres-data:
    name: talos-postgres-data
  talos-redis-data:
    name: talos-redis-data
